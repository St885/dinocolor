<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0c1f17" />
    <meta name="description" content="DinoColor — juego 3D de reflejos: pulsa rápido las pelotas que se iluminan. Mobile-first, temática jurásica." />

    <!-- Seguridad: no filtrar la URL como referer a terceros. Es seguro en dev y prod.
         La Content-Security-Policy se inyecta SOLO en el build de producción (ver
         vite.config.js): en dev rompería el HMR de Vite (usa scripts inline). Las
         cabeceras que no tienen equivalente <meta> (X-Content-Type-Options,
         Permissions-Policy) se documentan en docs/SECURITY.md para la capa de hosting. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Favicon + icono de app. Ambos viven en public/, así Vite los copia tal cual y
         las rutas relativas siguen funcionando en GitHub Pages (subcarpeta) y en
         Capacitor (file://). Antes: no había favicon (404 en consola en cada carga) y
         el icono del manifest apuntaba a un archivo que la build ni siquiera generaba. -->
    <link rel="icon" type="image/svg+xml" href="./assets/images/ui/icon.svg" />
    <link rel="apple-touch-icon" href="./assets/images/ui/icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>DinoColor — Pulsa rápido, gana el reto</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
